[project]
name = "taptap-codetest"
version = "0.1.0"
description = "Extracts, cleans, transforms and tabulates ad event JSONL data."
readme = "README.md"
authors = [
    { name = "Pablo Vinuales Esquinas", email = "pablo.vinuales@tinamica.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
]

[project.scripts]
taptap-codetest = "taptap_codetest.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
